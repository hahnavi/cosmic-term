[package]
name = "cosmic-term"
version = "1.9.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
alacritty_terminal = { git = "https://github.com/hahnavi/alacritty", branch = "hahnavi" }
hex_color = { version = "3", features = ["serde"] }
indexmap = "2.14.2"
log = "0.4"
open = "5.3.2"
paste = "1.0"
regex = "1"
ron = "0.12.2"
serde = { version = "1", features = ["serde_derive"] }
shlex = "2.0.1"
tokio = { version = "1.53.3", features = ["sync"] }
# CLI arguments
clap_lex = "1.1.1"
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
icu_collator = { version = "2.3", features = ["compiled_data"] }
icu_locale = { version = "2.3", features = ["compiled_data"] }
rust-embed = "8"
url = "2.5"
secret-service = { version = "5.1.0", features = [
    "rt-tokio-crypto-rust",
], optional = true }
thiserror = { version = "2.0", optional = true }
secstr = { version = "0.5", optional = true }

[dependencies.cosmic-text]
git = "https://github.com/hahnavi/cosmic-text.git"
branch = "hahnavi"
features = ["monospace_fallback", "shape-run-cache"]

[dependencies.libcosmic]
git = "https://github.com/hahnavi/libcosmic.git"
branch = "hahnavi"
default-features = false
#TODO: a11y feature crashes file chooser dialog
features = [
    "about",
    "autosize",
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
    "xdg-portal",
    "tiny-skia",
]

[target.'cfg(unix)'.dependencies]
fork = "0.10.0"

[build-dependencies]
xdgen = "0.1"

[features]
default = ["dbus-config", "wgpu", "wayland"]
dbus-config = ["libcosmic/dbus-config"]
wgpu = ["libcosmic/wgpu"]
wayland = ["libcosmic/wayland"]
password_manager = ["secret-service", "thiserror", "secstr"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
debug = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

